name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install npm dependencies
        run: npm ci

      - name: Static export + Capacitor sync
        run: npm run build:android
        env:
          CAPACITOR_BUILD: "1"
          NEXT_PUBLIC_CLIENT_BRIEFING: "1"

      # ubuntu-latest already ships an Android SDK. Do NOT use
      # android-actions/setup-android — it still requests the removed
      # legacy "tools" package and fails with: Failed to find package 'tools'.
      - name: Ensure Android SDK packages
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-}}"
          if [ -z "${ANDROID_HOME}" ]; then
            echo "ANDROID_HOME not set on runner" >&2
            exit 1
          fi
          echo "Using ANDROID_HOME=$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager "$ANDROID_HOME"/tools/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          else
            echo "sdkmanager not found; relying on preinstalled SDK packages"
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilot-briefing-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
